<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mmon Oki</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Mmon Oki</h1>
  </header>
  <main>
    <section id="hero">
      <div class="row">
        <div class="column">
          <img src="img/image0 (17).jpg" alt="潮干狩り画像">
          <p><a href="https://mmonoki.github.io/Portfolio/link">潮干狩りが好き</a></p>
        </div>
        <div class="column">
          <img src="img/image0.jpeg" alt="猫の画像">
          <p><a href="https://mmonoki.github.io/Portfolio/link">猫が好き（犬も好き）</a></p>
        </div>
      </div>
      <p><a href="https://goldenkings.jp/" target="_blank" rel="noopener noreferrer">琉球ゴールデンキングスが好き</a></p>

    <section id="About">
      <h2>About Me</h2>
      <p>私はMmon Okiです。<br>色んなアプリが作れるようになりたいです。</p>
    </section>
    <section id="MyWorks">
      <h2>My Works</h2>
      <div class="responsive-table">
        <table>
          <thead>
            <tr>
              <th>作品</th>
              <th>紹介</th>
              <th>リンク</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td data-label="作品">メモアプリ（これも乙）</td>
              <td data-label="紹介">日々のあれこれを画像をあげて一言メモ。</td>
              <td data-label="リンク">
                <!-- リンクアイコンをボタンに変更 -->
                <a href="https://mmonoki.github.io/Portfolio/memo" target="_blank" rel="noopener noreferrer">
                  <button class="link-button">メモアプリ</button>
                </a>
              </td>
            </tr>
            <tr>
              <td data-label="作品">血圧管理アプリ</td>
              <td data-label="紹介">血圧を測定して入力すると収縮期血圧 (上)と拡張期血圧 (下)それぞれがグラフで表示されます。</td>
              <td data-label="リンク">
                <!-- リンクアイコンをボタンに変更 -->
                <a href="https://mmonoki.github.io/Portfolio/ketuatu" target="_blank" rel="noopener noreferrer">
                  <button class="link-button">血圧管理アプリ</button>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    <p>Mkon Oki</p>
